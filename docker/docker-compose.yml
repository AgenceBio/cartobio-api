volumes:
  geo-db-data:
  db-18-data:

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v3/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
    - "../.env:/usr/src/app/.env:ro"
    environment:
      TARGET_DATABASE_URL: postgresql://docker:docker@db-18:5432/cartobio
    depends_on:
    - db-18
    ports:
    - 8000:8000
    networks:
    - internal
    - external

  db:
    image: kartoza/postgis:15-3.4
    volumes:
      - geo-db-data:/var/lib/postgresql
    restart: on-failure
    healthcheck:
      test: "pg_isready"
    environment:
      ALLOW_IP_RANGE: "0.0.0.0/0" # we need that to allow 'api' to connect
      POSTGRES_USER: docker
      POSTGRES_PASS: docker
    ports:
    - 15432:5432
    networks:
    - internal

  db-18:
    image: postgis/postgis:18-3.6
    volumes:
      - db-18-data:/var/lib/postgresql
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d cartobio"]
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: cartobio
    ports:
    - 25432:5432
    networks:
    - internal

  maildev:
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025
    networks:
      - internal

networks:
  internal:
  external:
